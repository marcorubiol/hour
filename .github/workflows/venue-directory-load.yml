name: Venue directory load

# Directorio global de salas: descarga las fuentes públicas, construye load.sql y lo carga en producción.
# `plan` solo construye y enseña el informe; `load` además escribe en la base (una transacción, idempotente).
# Sirve también para el refresco mensual. Ver scripts/venue-directory/.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (build and report) or load (build and write to production)
        required: true
        default: plan
        type: choice
        options:
          - plan
          - load
      confirm:
        description: Exact confirmation phrase for load (empty for plan)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  build-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      PRODUCTION_PROJECT_REF: lqlyorlccnniybezugme
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Prove the production target and operator intent
        if: inputs.mode == 'load'
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" || "$SUPABASE_DB_URL" != *"$PRODUCTION_PROJECT_REF"* ]]; then
            echo 'SUPABASE_DB_URL is missing or not the production project.' >&2
            exit 1
          fi
          expected="LOAD VENUE DIRECTORY $PRODUCTION_PROJECT_REF"
          if [ "$CONFIRM" != "$expected" ]; then
            echo "Confirmation must be exactly: $expected" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the public sources
        run: node scripts/venue-directory/fetch.mjs

      - name: Build load.sql
        run: |
          set -euo pipefail
          node scripts/venue-directory/build.mjs
          ls -l .cache/venue-directory/out/
          node -e 'const r=require("./.cache/venue-directory/out/report.json"); console.log(JSON.stringify({rows:r.rows, by_country:r.by_country, by_kind:r.by_kind}, null, 2))'

      - name: Load into production
        if: inputs.mode == 'load'
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet --file .cache/venue-directory/out/load.sql

      - name: Count what landed
        if: inputs.mode == 'load'
        run: |
          set -euo pipefail
          expected=$(node -e 'console.log(require("./.cache/venue-directory/out/report.json").rows)')
          active=$(psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
            --command "select count(*) from public.venue_directory where status = 'active'")
          psql "$SUPABASE_DB_URL" --no-psqlrc --command \
            "select country, status, count(*) from public.venue_directory group by 1, 2 order by 1, 2"
          psql "$SUPABASE_DB_URL" --no-psqlrc --command \
            "select key, data_date, imported_at from public.venue_directory_source order by 1"
          echo "Expected rows: $expected · active in production: $active"
          if [ "$active" -lt "$expected" ]; then
            echo 'Fewer active rows than the build produced.' >&2
            exit 1
          fi

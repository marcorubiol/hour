name: Supabase production migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, finalize the one-time baseline history, or apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - inspect
          - repair-baseline-history
          - apply
      confirm:
        description: Exact confirmation phrase for the selected mode
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  plan-or-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      PRODUCTION_PROJECT_REF: lqlyorlccnniybezugme
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Prove the production target and operator intent
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo 'SUPABASE_DB_URL is not configured.' >&2
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *"$PRODUCTION_PROJECT_REF"* ]]; then
            echo 'SUPABASE_DB_URL does not contain the canonical production project ref.' >&2
            exit 1
          fi
          case "$MODE" in
            plan) expected='PLAN PRODUCTION' ;;
            inspect) expected='INSPECT PRODUCTION' ;;
            repair-baseline-history) expected="REPAIR BASELINE $PRODUCTION_PROJECT_REF" ;;
            apply) expected="MIGRATE PRODUCTION $PRODUCTION_PROJECT_REF" ;;
            *) echo "Unsupported mode: $MODE" >&2; exit 1 ;;
          esac
          if [ "$CONFIRM" != "$expected" ]; then
            echo "Confirmation must be exactly: $expected" >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Finalize the reconstructive baseline history
        if: inputs.mode == 'repair-baseline-history'
        run: |
          set -euo pipefail
          checkpoint='20260720105713'
          checkpoint_count="$(
            docker run --rm postgres:17-alpine \
              psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
              --set ON_ERROR_STOP=1 \
              --command "select count(*) from supabase_migrations.schema_migrations where version = '$checkpoint';"
          )"
          if [ "$checkpoint_count" != '1' ]; then
            echo "Expected applied checkpoint $checkpoint exactly once; got $checkpoint_count." >&2
            exit 1
          fi

          mapfile -t legacy_versions < <(
            docker run --rm postgres:17-alpine \
              psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
              --set ON_ERROR_STOP=1 \
              --command "select version from supabase_migrations.schema_migrations where version < '$checkpoint' order by version;"
          )
          if [ "${#legacy_versions[@]}" -eq 0 ]; then
            echo 'Legacy history is already folded into the reconstructive checkpoint.'
          else
            echo "Folding ${#legacy_versions[@]} legacy history entries into checkpoint $checkpoint."
            supabase migration repair --db-url "$SUPABASE_DB_URL" \
              --status reverted "${legacy_versions[@]}"
          fi

      # READ-ONLY INTROSPECTION, because twice in one day (2026-08-10) a
      # production apply failed on something only the catalog could name, and
      # there was no way to ask from outside: the first cause had to be guessed
      # wrong once, and the second only surfaced because the migration itself
      # was taught to say who was holding a type. This mode asks the questions
      # that a destructive migration needs answered BEFORE it runs. Fixed
      # SELECTs, no input reaches the SQL, and it never runs alongside apply.
      - name: Inspect the production catalog
        if: inputs.mode == 'inspect'
        run: |
          set -euo pipefail
          run_sql() {
            docker run --rm postgres:17-alpine \
              psql "$SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command "$1"
          }

          echo '### Archive schemas (the squash leaves these behind)'
          run_sql "select n.nspname as schema,
                          count(c.oid) filter (where c.relkind = 'r') as tables,
                          coalesce(sum(c.reltuples)::bigint, 0) as approx_rows
                     from pg_namespace n
                     left join pg_class c on c.relnamespace = n.oid
                    where n.nspname like 'hour\_backup\_%'
                    group by n.nspname order by n.nspname;"

          echo '### What each archive schema holds'
          run_sql "select n.nspname as schema, c.relname as table, c.reltuples::bigint as approx_rows
                     from pg_class c join pg_namespace n on n.oid = c.relnamespace
                    where n.nspname like 'hour\_backup\_%' and c.relkind = 'r'
                    order by 1, 2;"

          echo '### Types in public that nothing living uses'
          run_sql "select t.typname as orphan_type,
                          coalesce(string_agg(distinct n.nspname || '.' || c.relname, ', '), '(nothing)') as held_by
                     from pg_type t
                     left join pg_depend d on d.refobjid = t.oid and d.refclassid = 'pg_type'::regclass and d.deptype <> 'i'
                     left join pg_class c on c.oid = d.objid
                     left join pg_namespace n on n.oid = c.relnamespace
                    where t.typnamespace = 'public'::regnamespace and t.typtype = 'e'
                    group by t.typname
                   having count(*) filter (where n.nspname = 'public') = 0
                    order by 1;"

      - name: Print the migration plan
        if: inputs.mode != 'inspect'
        # --include-all: money v3's migrations are timestamped before an
        # out-of-band migration already on prod (accent_custom_hue), so they must
        # be applied out of order. Safe — the sets are orthogonal.
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all

      - name: Apply the migration plan
        if: inputs.mode == 'apply'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Verify remote migration history
        if: inputs.mode == 'apply'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Production database migration'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Mode: \`$MODE\`"
            echo "- Target ref: \`$PRODUCTION_PROJECT_REF\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
